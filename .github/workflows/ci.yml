name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }}${{ matrix.shard != '' && format(', shard {0}', matrix.shard) || '' }})
    runs-on: ${{ matrix.os }}
    # A test that hangs fails the run here instead of holding a runner for hours.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, node: 26, shard: '' }
          - { os: ubuntu-latest, node: 24, shard: '' }
          - { os: windows-latest, node: 26, shard: '1/2' }
          - { os: windows-latest, node: 26, shard: '2/2' }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
        env:
          TOWER_CRANE_TEST_TMP: ${{ runner.temp }}/tower-crane-tests
          TC_TEST_SHARD: ${{ matrix.shard }}
