name: Windows flake verification

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/windows-flakes.yml

permissions:
  contents: read

jobs:
  repeat:
    name: repetitions ${{ matrix.batch }}
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        batch: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Repeat lock, waiter and supervision suites five times
        shell: pwsh
        env:
          TOWER_CRANE_TEST_TMP: ${{ runner.temp }}/tower-crane-tests
        run: |
          $first = (${{ matrix.batch }} - 1) * 5 + 1
          for ($iteration = $first; $iteration -lt $first + 5; $iteration++) {
            Write-Host "Iteration $iteration of 20"
            node --test test/lock.test.js test/events.test.js test/supervision.test.js
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
